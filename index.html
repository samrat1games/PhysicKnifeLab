<!--
  ============================================================================
  PHYSICS HANDS VR — чистая VR-песочница для Google Cardboard
  ============================================================================
  Единственный элемент интерфейса — иконка «Вход в VR» внизу экрана.
  По клику: полноэкранный режим → дуальный стерео-вид (split-screen с коррекцией линз) →
  запрос гироскопа → запуск камеры и трекинга рук (камера работает скрыто, в фоне).

  Стек: Three.js (рендер, тени) · cannon-es (физика, constraints) · MediaPipe Hands (трекинг).

  Архитектура рук (physics-based hands):
    MediaPipe (21 точка) → адаптивное сглаживание → «цель» в мире
        → динамическое тело-ладонь с коллайдерами на пальцах, которое пружиной тянется к цели
        → визуальная рука рисуется на ФИЗИЧЕСКОМ теле (не проходит сквозь стены/предметы)
    Кулак → LockConstraint ограниченной силы между рукой и предметом (честные вес и инерция)
    Раскрытие → предмет получает скорость руки (бросок).

  Для компьютера без камеры: мышь — рука (ЛКМ — захват, колесо — глубина, ПКМ+drag — осмотр),
  WASD — ходьба, пробел — прыжок.
  ============================================================================
-->

<!-- MediaPipe Hands: обычный скрипт, создаёт глобальный класс Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script type="module">
import * as THREE  from 'three';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ==========================================================================
 * 0. КОНФИГУРАЦИЯ
 * ========================================================================== */
const CFG = {
  eyeHeight: 1.6, walkSpeed: 2.4, jumpSpeed: 4.4, eyeSep: 0.064,
  lens: { k1: 0.22, k2: 0.18 },          // бочкообразная дисторсия под линзы Cardboard
  gazeWalkPitch: -0.9,                   // наклон головы вниз (рад) → идти вперёд
  hand: {
    palmRadius: 0.055, fingerRadius: 0.016,
    mass: 2,                // масса физической руки
    stiffness: 1800,        // пружина руки к реальной позиции
    maxForce: 900,          // предел силы руки (Н)
    grabMaxForce: 320,      // предел силы захвата (Н): ≈32 кг статически → 40-кг ящик не поднять
    grabReach: 0.10,        // дистанция, с которой пальцы «видят» предмет
    grabOn: 0.65, grabOff: 0.40,  // гистерезис жеста сжатия
    throwBoost: 1.0, maxThrow: 10,
  },
};
const G_WORLD = 1, G_PLAYER = 2, G_OBJ = 4, G_HAND = 8, G_RAG = 16;
const MASK_OBJ = G_WORLD | G_PLAYER | G_OBJ | G_HAND | G_RAG;
const RAG_MASK = G_WORLD | G_PLAYER | G_OBJ | G_HAND;     // части тела человека не сталкиваются друг с другом (нет дрожания в суставах)

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = d => d * Math.PI / 180;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const Y_AXIS = new THREE.Vector3(0, 1, 0), Z_AXIS = new THREE.Vector3(0, 0, 1);

/* ==========================================================================
 * 1. РЕНДЕР: сцена, камера, мягкие тени, стерео-постпроцесс
 * ========================================================================== */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, stencil: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.autoClear = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;       // тени обновляем один раз за кадр (общие для обоих глаз)

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7b878c);
scene.fog = new THREE.Fog(0x7b878c, 10, 38);   // пол растворяется в тумане, как в пустой тестовой комнате

// Мягкое окружающее отражение (для металла) — процедурная «комната», без внешних текстур
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(72, 1, 0.04, 130);
camera.focus = 6;
scene.add(camera);

// Небесный купол: тёмный зенит → светлый туманный горизонт. Следует за головой, поэтому «бесконечный».
const sky = new THREE.Mesh(new THREE.SphereGeometry(100, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x35434c) }, hor: { value: new THREE.Color(0x7b878c) } },
  vertexShader: `varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform vec3 top, hor; varying float h;
    void main(){
      gl_FragColor = vec4(mix(hor, top, smoothstep(0.0, 0.55, h)), 1.);
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -1000; sky.frustumCulled = false;
scene.add(sky);

// Облака (спрайты на небесном куполе) — видны только на открытых картах
const clouds = new THREE.Group(); sky.add(clouds);
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 4, 64, 64, 60);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  for (let i = 0; i < 16; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, fog: false, opacity: 0.9 }));
    const az = Math.random() * 6.283, el = 0.18 + Math.random() * 0.75, r = 90;
    sp.position.set(Math.cos(az) * Math.cos(el) * r, Math.sin(el) * r, Math.sin(az) * Math.cos(el) * r);
    sp.scale.set(40 + Math.random() * 30, 14 + Math.random() * 8, 1); clouds.add(sp);
  }
  clouds.visible = false;
}

// Освещение: ambient + hemisphere (заполняющий) + направленный свет с мягкими тенями
const ambient = new THREE.AmbientLight(0xffffff, 0.3); scene.add(ambient);
const hemi = new THREE.HemisphereLight(0xdfe8ee, 0x555c60, 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(3, 7, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 20 });
sun.shadow.radius = 4; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

const stereo = new THREE.StereoCamera();
stereo.eyeSep = CFG.eyeSep; stereo.aspect = 0.5;

let rtL, rtR;
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: { tL: { value: null }, tR: { value: null }, k: { value: new THREE.Vector2(CFG.lens.k1, CFG.lens.k2) }, aspect: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  // Склеиваем два глаза и применяем бочкообразную дисторсию (компенсирует подушкообразную линз)
  fragmentShader: `
    uniform sampler2D tL, tR; uniform vec2 k; uniform float aspect; varying vec2 vUv;
    void main(){
      bool left = vUv.x < 0.5;
      vec2 uv = vec2(left ? vUv.x * 2.0 : (vUv.x - 0.5) * 2.0, vUv.y);
      vec2 sc = vec2(aspect, 1.0) * 2.0;
      vec2 c = (uv - 0.5) * sc;
      float r2 = dot(c, c);
      c *= 1.0 + k.x * r2 + k.y * r2 * r2;
      vec2 s = c / sc + 0.5;
      if (s.x < 0. || s.x > 1. || s.y < 0. || s.y > 1. || abs(vUv.x - 0.5) < 0.0012) gl_FragColor = vec4(0., 0., 0., 1.);
      else gl_FragColor = left ? texture2D(tL, s) : texture2D(tR, s);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

function makeTargets() {
  rtL?.dispose(); rtR?.dispose();
  const pr = renderer.getPixelRatio();
  const w = Math.max(2, Math.floor(innerWidth * pr / 2)), h = Math.max(2, Math.floor(innerHeight * pr));
  const o = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, samples: 4, type: THREE.HalfFloatType, stencilBuffer: true };
  rtL = new THREE.WebGLRenderTarget(w, h, o); rtR = new THREE.WebGLRenderTarget(w, h, o);
  postMat.uniforms.tL.value = rtL.texture; postMat.uniforms.tR.value = rtR.texture;
  postMat.uniforms.aspect.value = w / h;
}

let vrMode = false;
let lensCorrection = true;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  makeTargets();
}
addEventListener('resize', resize);

function render() {
  camera.fov = vrMode ? 85 : 72;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true;       // один раз на кадр
  if (!vrMode) {
    renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
    return;
  }
  stereo.update(camera);
  postMat.uniforms.k.value.set(lensCorrection ? CFG.lens.k1 : 0, lensCorrection ? CFG.lens.k2 : 0);
  renderer.setRenderTarget(rtL); renderer.clear(); renderer.render(scene, stereo.cameraL);
  renderer.setRenderTarget(rtR); renderer.clear(); renderer.render(scene, stereo.cameraR);
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(postScene, postCam);
}

/* ==========================================================================
 * 2. ФИЗИКА (cannon-es): мир, материалы
 * ========================================================================== */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.solver.iterations = 14;
world.defaultContactMaterial.friction = 0.5;
world.defaultContactMaterial.restitution = 0.1;

const matDefault = world.defaultMaterial;
const matRubber = new CANNON.Material('rubber');
const matPlayer = new CANNON.Material('player');
const matHand = new CANNON.Material('hand');
const contact = (a, b, f, r) => world.addContactMaterial(new CANNON.ContactMaterial(a, b, { friction: f, restitution: r }));
contact(matRubber, matDefault, 0.9, 0.72);
contact(matRubber, matRubber, 0.9, 0.8);
contact(matPlayer, matDefault, 0, 0); contact(matPlayer, matRubber, 0, 0);
contact(matHand, matDefault, 0.8, 0); contact(matHand, matRubber, 0.9, 0);

/* ==========================================================================
 * 3. ТЕКСТУРЫ (процедурные) И ФАБРИКИ ОБЪЕКТОВ
 * ========================================================================== */
function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const concreteTex = (rep) => canvasTex(512, (x, s) => {
  x.fillStyle = '#8c9096'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) {                       // зернистость бетона
    const v = 110 + Math.random() * 60 | 0;
    x.fillStyle = `rgba(${v},${v},${v + 4},${0.15 + Math.random() * 0.25})`;
    x.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  x.strokeStyle = '#6d7177'; x.lineWidth = 3; x.strokeRect(0, 0, s, s);   // швы плит
}, rep);
const woodTex = () => canvasTex(128, (x, s) => {
  x.fillStyle = '#c9985f'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(110,70,30,${Math.random() * 0.25})`; x.fillRect(0, Math.random() * s, s, 1 + Math.random() * 2); }
  x.strokeStyle = '#8a5f33'; x.lineWidth = 6; x.strokeRect(0, 0, s, s);
});
const crateTex = () => canvasTex(256, (x, s) => {
  x.fillStyle = '#4b4f55'; x.fillRect(0, 0, s, s);
  x.strokeStyle = '#8d949c'; x.lineWidth = 16; x.strokeRect(8, 8, s - 16, s - 16);
  x.lineWidth = 8; x.beginPath(); x.moveTo(16, 16); x.lineTo(s - 16, s - 16); x.moveTo(s - 16, 16); x.lineTo(16, s - 16); x.stroke();
  x.fillStyle = '#c0c6cc'; for (const [a, b] of [[22, 22], [s - 22, 22], [22, s - 22], [s - 22, s - 22]]) { x.beginPath(); x.arc(a, b, 6, 0, 7); x.fill(); }
});

const grassTex = () => canvasTex(128, (x, s) => {
  x.fillStyle = '#3d8a3a'; x.fillRect(0, 0, s, s);
  x.fillStyle = '#46973f'; x.fillRect(0, 0, s / 2, s / 2); x.fillRect(s / 2, s / 2, s / 2, s / 2);
  x.strokeStyle = '#78c65f'; x.lineWidth = 3; x.strokeRect(0, 0, s, s);
}, [160, 160]);
const slateTex = rep_ => canvasTex(128, (x, s) => {
  x.fillStyle = '#59616d'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 400; i++) { const v = 80 + Math.random() * 30 | 0; x.fillStyle = `rgba(${v},${v + 6},${v + 14},.25)`; x.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
  x.strokeStyle = '#98a3b1'; x.lineWidth = 4; x.strokeRect(0, 0, s, s);
}, rep_);
const hazardTex = () => canvasTex(128, (x, s) => {
  x.fillStyle = '#f1c40f'; x.fillRect(0, 0, s, s);
  x.fillStyle = '#17181a'; x.save(); x.translate(s / 2, s / 2); x.rotate(-0.785);
  for (let i = -8; i < 8; i += 2) x.fillRect(-s, i * 16, s * 2, 16);
  x.restore();
});

const allObjs = [];

function stdMat(o) {
  const m = new THREE.MeshStandardMaterial({ color: o.color ?? 0xffffff, map: o.map ?? null,
    roughness: o.rough ?? 0.7, metalness: o.metal ?? 0.05 });
  m.envMapIntensity = 0.35;
  return m;
}

/** Ящик: статический (mass=0), кинематический или динамический. */
function addBox({ size, pos, mass = 0, rot, material, color, map, rough, metal, visible = true, group }) {
  const half = new CANNON.Vec3(size[0] / 2, size[1] / 2, size[2] / 2);
  const body = new CANNON.Body({
    mass, material, shape: new CANNON.Box(half), position: new CANNON.Vec3(...pos), allowSleep: false,
    collisionFilterGroup: mass > 0 ? (group ?? G_OBJ) : G_WORLD,
    collisionFilterMask: mass > 0 ? (group === G_RAG ? RAG_MASK : MASK_OBJ) : (G_PLAYER | G_OBJ | G_HAND | G_RAG),
  });
  if (rot) body.quaternion.setFromEuler(rot[0], rot[1], rot[2]);
  world.addBody(body);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), stdMat({ color, map, rough, metal }));
  mesh.castShadow = mesh.receiveShadow = true; mesh.visible = visible;
  mesh.position.copy(body.position); mesh.quaternion.copy(body.quaternion);
  scene.add(mesh);
  const o = { body, mesh, kind: 'box', half, dynamic: mass > 0 };
  body.userData = o; allObjs.push(o);
  return o;
}

function addSphere({ r, pos, mass, color, material, rough = 0.45, metal = 0.05, group, withStripe = true }) {
  const body = new CANNON.Body({ mass, material, shape: new CANNON.Sphere(r), position: new CANNON.Vec3(...pos),
    collisionFilterGroup: group ?? G_OBJ, collisionFilterMask: group === G_RAG ? RAG_MASK : MASK_OBJ, allowSleep: false, angularDamping: 0.05 });
  world.addBody(body);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), stdMat({ color, rough, metal }));
  const stripe = new THREE.Mesh(new THREE.TorusGeometry(r * 1.001, r * 0.07, 8, 32), new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.6 }));
  if (withStripe) mesh.add(stripe);
  mesh.castShadow = true; scene.add(mesh);
  const o = { body, mesh, kind: 'sphere', r, dynamic: true };
  body.userData = o; allObjs.push(o);
  return o;
}

/* ==========================================================================
 * 4. ЛОКАЦИЯ: светлый бетонный полигон + предметы
 * ========================================================================== */
function gridTex() {
  // Серая плита 1×1 м со светлыми швами
  return canvasTex(256, (x, s) => {
    x.fillStyle = '#8b8b85'; x.fillRect(0, 0, s, s);
    for (let i = 0; i < 2500; i++) { const v = 120 + Math.random() * 40 | 0; x.fillStyle = `rgba(${v},${v},${v - 4},0.12)`; x.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
    x.strokeStyle = '#e6e8e3'; x.lineWidth = 5; x.strokeRect(0, 0, s, s);
  }, [80, 80]);
}

function buildGrid() {
  look(LOOKS.grid); mapBounds = { x: 12, z0: -12, z1: 7 };
  // Пол — огромная плита; дальше она тонет в тумане
  const floor = addBox({ size: [80, 1, 80], pos: [0, -0.5, 0], map: gridTex(), rough: 0.95 });
  floor.mesh.castShadow = false;
  // Невидимые, но твёрдые границы: игрок, руки и предметы не выходят за пределы арены
  const inv = { visible: false };
  addBox({ size: [1, 10, 30], pos: [-14, 5, -2.5], ...inv });
  addBox({ size: [1, 10, 30], pos: [14, 5, -2.5], ...inv });
  addBox({ size: [30, 10, 1], pos: [0, 5, -14], ...inv });
  addBox({ size: [30, 10, 1], pos: [0, 5, 9], ...inv });
  addBox({ size: [30, 1, 30], pos: [0, 7, -2.5], ...inv });
}

/* ---- Карты ---- */
const LOOKS = {
  grid:  { top: 0x35434c, hor: 0x7b878c, fogNear: 10, fogFar: 38, ambient: 0.3, hemi: 0.55, hemiSky: 0xdfe8ee, sun: 1.7, shadow: 7, clouds: false },
  arena: { top: 0x3f86d6, hor: 0xcfe4f4, fogNear: 35, fogFar: 115, ambient: 0.55, hemi: 0.7, hemiSky: 0xdcecff, sun: 2.1, shadow: 13, clouds: true },
  room:  { top: 0x9aa0a6, hor: 0xb9bec3, fogNear: 20, fogFar: 60, ambient: 0.5, hemi: 0.6, hemiSky: 0xffffff, sun: 1.3, shadow: 8, clouds: false },
};
let mapName = 'grid', mapBounds = { x: 12, z0: -12, z1: 7 };
const envExtras = [];                           // декор карты без физики (дорожка, лампы)
const addExtra = m => { scene.add(m); envExtras.push(m); return m; };

/** Применяет «погоду»: цвета неба и тумана, свет, облака, зону теней */
function look(o) {
  sky.material.uniforms.top.value.setHex(o.top); sky.material.uniforms.hor.value.setHex(o.hor);
  scene.background.setHex(o.hor); scene.fog.color.setHex(o.hor); scene.fog.near = o.fogNear; scene.fog.far = o.fogFar;
  clouds.visible = o.clouds; ambient.intensity = o.ambient; hemi.intensity = o.hemi; hemi.color.setHex(o.hemiSky); sun.intensity = o.sun;
  Object.assign(sun.shadow.camera, { left: -o.shadow, right: o.shadow, top: o.shadow, bottom: -o.shadow });
  sun.shadow.camera.updateProjectionMatrix();
}

/** Полная пересборка мира под выбранную карту (предметы, боты, люди и соединения удаляются) */
function loadMap(name) {
  hands.forEach(h => h.release(false));
  for (const c of [...world.constraints]) world.removeConstraint(c);
  for (const o of allObjs) { world.removeBody(o.body); scene.remove(o.mesh); }
  allObjs.length = 0; spawned.length = 0; spawnedConstraints.length = 0; bots.length = 0;
  for (const m of envExtras) scene.remove(m);
  envExtras.length = 0;
  mapName = name; MAPS[name]();
  buildProps();
  staticObjs = allObjs.filter(o => !o.dynamic);
  player.position.set(0, 0.02, 1.5); player.velocity.set(0, 0, 0);
}

/** Рычаг: основание (static) + рукоять (dynamic) на HingeConstraint, ограничители хода — невидимые упоры. */
function buildLever(x, z) {
  const base = addBox({ size: [0.34, 0.12, 0.3], pos: [x, 0.06, z], color: 0x3b3f45, metal: 0.6, rough: 0.5 });
  const arm = addBox({ size: [0.06, 0.7, 0.06], pos: [x, 0.12 + 0.35, z], mass: 3, color: 0xc9ced4, metal: 0.8, rough: 0.35 });
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14), stdMat({ color: 0xd2452f, rough: 0.4 }));
  knob.position.y = 0.37; knob.castShadow = true; arm.mesh.add(knob);
  arm.body.angularDamping = 0.5;
  world.addConstraint(new CANNON.HingeConstraint(base.body, arm.body, {
    pivotA: new CANNON.Vec3(0, 0.06, 0), axisA: new CANNON.Vec3(0, 0, 1),
    pivotB: new CANNON.Vec3(0, -0.35, 0), axisB: new CANNON.Vec3(0, 0, 1), collideConnected: false }));
  // Упоры ±~40°
  for (const s of [-1, 1]) {
    const a = 0.85, R = 0.5;
    addBox({ size: [0.06, 0.06, 0.2], pos: [x + s * Math.sin(a) * R, 0.12 + Math.cos(a) * R, z], visible: false });
  }
}

 * 6. ГОЛОВА: гироскоп + ручной обзор
 * ========================================================================== */

addEventListener('deviceorientation', e => {

  head.hasGyro = true; head.alpha = e.alpha; head.beta = e.beta; head.gamma = e.gamma;
});
/**
 * Позиционное отслеживание головы (3DoF+) по акселерометру. Браузеры на iPhone не дают настоящий 6DoF
 * (нет WebXR/ARKit в Safari), поэтому положение оцениваем интегрированием линейного ускорения
 * (devicemotion.acceleration) с демпфированием, обнулением скорости в покое (ZUPT) и возвратом к центру
 * против дрейфа. Хорошо ловит наклоны, приседания, шаг в сторону, заглядывание за предмет (до ±0.6 м).
 */
const motion = { has: false, a: new THREE.Vector3(), v: new THREE.Vector3(), p: new THREE.Vector3(), calm: 0, stepT: 0, lastStep: 0 };
addEventListener('devicemotion', e => {

  motion.a.set(a.x * c + a.y * s, -a.x * s + a.y * c, a.z);        // ось устройства → ось экрана (= оси камеры)
  // Шаги на месте: резкий пик ускорения = шаг, запускает ходьбу вперёд примерно на полсекунды
  const mag = Math.hypot(a.x, a.y, a.z), tn = performance.now();

});

  if (!state.sixdof || !motion.has) { motion.v.set(0, 0, 0); motion.p.multiplyScalar(Math.exp(-dt * 4)); return; }

  if (_w.length() < 0.12) { motion.calm += dt; _w.set(0, 0, 0); } else motion.calm = 0;
  motion.v.addScaledVector(_w, dt * 1.2);
  motion.v.multiplyScalar(Math.exp(-dt * (motion.calm > 0.2 ? 14 : 2.5)));   // ZUPT: в покое скорость гасим быстро
  motion.p.addScaledVector(motion.v, dt);

function deviceQuat(out) {
  const orient = rad(screen.orientation ? screen.orientation.angle : (window.orientation || 0));
  _e.set(rad(head.beta), rad(head.alpha), -rad(head.gamma), 'YXZ');
  out.setFromEuler(_e).multiply(_q1).multiply(_q0.setFromAxisAngle(Z_AXIS, -orient));
  return out;
}
function recenter() {
  head.yawManual = 0;
  if (head.hasGyro) {
    deviceQuat(_devQ);
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(_devQ);
    head.yawOffset = -Math.atan2(-f.x, -f.z);
  } else head.yawOffset = 0;
  head.needCenter = false;
}
function updateHead() {
  if (head.hasGyro) {
    if (head.needCenter) recenter();
    deviceQuat(_devQ);
    camera.quaternion.copy(_yawQ.setFromAxisAngle(Y_AXIS, head.yawOffset + head.yawManual)).multiply(_devQ);
  } else {
    camera.quaternion.setFromEuler(_e.set(head.pitchManual, head.yawManual, 0, 'YXZ'));
  }
}

const keys = new Set();

addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') jump(); if (e.code === 'KeyC') recenter(); if (e.code === 'KeyF') shoot(); });
addEventListener('keyup', e => keys.delete(e.code));

canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  if (vrMode) { if (ui.gaze) activate(ui.gaze.id, ui.gaze.p); else if (!shoot()) jump(); return; }   // тап: клик / выстрел / прыжок   // тап: клик по пункту под взглядом или прыжок
  { const pick = mousePick(e); if (pick && pick.item) { activate(pick.item.id, pick.p); return; } }                   // тап в гарнитуре = прыжок
  mouse.lx = e.clientX; mouse.ly = e.clientY;
  if (e.button === 2 || e.shiftKey) mouse.drag = true; else mouse.down = true;
  setMouse(e);
});
canvas.addEventListener('pointermove', e => {
  setMouse(e);
  ui.mouse = vrMode ? null : mousePick(e);

    if (!head.hasGyro) head.pitchManual = clamp(head.pitchManual - (e.clientY - mouse.ly) * 0.004, -1.4, 1.4);

});
const pointerEnd = () => { mouse.down = false; mouse.drag = false; };
canvas.addEventListener('pointerup', pointerEnd); canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('wheel', e => { mouse.depth = clamp(mouse.depth - e.deltaY * 0.001, 0.3, 1.6); }, { passive: true });

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],

            0.0150, 0.0115, 0.0100, 0.0090, 0.0140, 0.0105, 0.0092, 0.0085];

/** Статическая геометрия (пол, стол, дверная рама, границы) — сюда рука не должна заходить. */
let staticObjs = [];
const _pl = new CANNON.Vec3(), _pw = new CANNON.Vec3();
/** Выталкивает точку (мир) радиуса r из всех статических ящиков. Правит pt на месте. */
function pushOutOfStatics(pt, r) {
  for (let pass = 0; pass < 2; pass++) {
    let moved = false;
    for (const o of staticObjs) {
      const h = o.half;
      _pw.set(pt.x, pt.y, pt.z); o.body.pointToLocalFrame(_pw, _pl);
      if (h.x + r - Math.abs(_pl.x) <= 0 || h.y + r - Math.abs(_pl.y) <= 0 || h.z + r - Math.abs(_pl.z) <= 0) continue;
      const px = h.x + r - Math.abs(_pl.x), py = h.y + r - Math.abs(_pl.y), pz = h.z + r - Math.abs(_pl.z);
      if (h.y < 0.1 && _pl.y > -h.y * 0.6) _pl.y = h.y + r;                  // тонкая плита (столешница): наверх
      else if (px < py && px < pz) _pl.x = Math.sign(_pl.x || 1) * (h.x + r);
      else if (py < pz) _pl.y = Math.sign(_pl.y || 1) * (h.y + r);
      else _pl.z = Math.sign(_pl.z || 1) * (h.z + r);
      o.body.pointToWorldFrame(_pl, _pw); pt.set(_pw.x, _pw.y, _pw.z); moved = true;
    }
    if (!moved) break;
  }
}

    };
    this.jointMeshes = JR.map(r => { const m = add(jointGeo); m.scale.setScalar(r); return m; });
    this.boneMeshes = BONES.map(([a, b]) => add(new THREE.CylinderGeometry(JR[b] * 0.95, JR[a] * 0.95, 1, 14)));
    this.palmGeo = new THREE.BufferGeometry();
    this.palmGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12 * 3), 3));
    this.palm = add(this.palmGeo, true);
    this.blob = add(new THREE.SphereGeometry(1, 18, 12));      // мягкая «подушка» ладони
    // Предплечье: открытая трубка, непрозрачность плавно падает от запястья к локтю (без торца)
    const fg = new THREE.CylinderGeometry(0.034, 0.046, 1, 20, 8, true);
    const fp = fg.attributes.position, fc = new Float32Array(fp.count * 4);
    for (let i = 0; i < fp.count; i++) { const t = fp.getY(i) + 0.5; fc.set([1, 1, 1, t * t * t], i * 4); }
    fg.setAttribute('color', new THREE.BufferAttribute(fc, 4));
    const fm = this.mat.clone(); fm.vertexColors = true; fm.side = THREE.DoubleSide; fm.depthWrite = false;
    this.forearm = new THREE.Mesh(fg, fm); this.forearm.renderOrder = 12; this.forearm.frustumCulled = false;
    this.group.add(this.forearm);

    // Указка: тонкий луч от ладони и кольцо-курсор в точке наведения на меню
    this.ray = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0022, 1, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, depthTest: false, fog: false }));
    this.ring = new THREE.Mesh(new THREE.RingGeometry(0.013, 0.018, 28),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false, side: THREE.DoubleSide, fog: false }));
    for (const m of [this.ray, this.ring]) { m.visible = false; m.renderOrder = 60; m.frustumCulled = false; scene.add(m); }
  }
  setSeen(now) { this.lastSeen = now; }

  /** До физического шага: сглаживание, перевод в мир, цель для пружины, захват/отпускание. */
  update(dt, now) {
    if (!((now - this.lastSeen) < 350 && this.hasJoints)) { if (this.visible) this.hide(); return; }

    // Сглаживание на частоте рендера (детекции приходят реже и ступенчато)
    const k = 1 - Math.exp(-dt * 28);
    for (let i = 0; i < 21; i++) this.joints[i].lerp(this.tgt[i], k);
    for (let i = 0; i < 21; i++) this.wj[i].copy(this.joints[i]).applyMatrix4(camera.matrixWorld);
    // Жёсткое ограничение: суставы не заходят в пол, стол и стены (рука «упирается» в поверхность)
    // Непрерывное ограничение ладони: идём к цели шагами по 2 см и скользим по поверхностям, поэтому
    // даже при резком движении невозможно «перескочить» тонкую столешницу или пол.
    this.palmW.set(0, 0, 0); for (const i of PALM_IDX) this.palmW.add(this.wj[i]); this.palmW.multiplyScalar(1 / 5);
    if (!this.hasSafe) { this.safe.copy(this.palmW); pushOutOfStatics(this.safe, 0.05); this.hasSafe = true; }
    for (let k = 0; k < 80; k++) {
      _v.copy(this.palmW).sub(this.safe); const d = _v.length();
      if (d < 1e-4) break;
      this.safe.addScaledVector(_v, Math.min(0.02, d) / d); pushOutOfStatics(this.safe, 0.05);
    }
    _v.copy(this.safe).sub(this.palmW);
    for (let i = 0; i < 21; i++) { this.wj[i].add(_v); pushOutOfStatics(this.wj[i], JR[i]); }   // пальцы — тоже наружу
    this.palmW.set(0, 0, 0); for (const i of PALM_IDX) this.palmW.add(this.wj[i]); this.palmW.multiplyScalar(1 / 5);

    // Скорость цели (для упреждения пружины при ходьбе/повороте головы)
    if (this.hasPrev) {
      _v.copy(this.palmW).sub(this.prevTarget).multiplyScalar(1 / dt);
      const sp = _v.length(); if (sp > 6) _v.multiplyScalar(6 / sp);
      this.tv.set(this.tv.x + (_v.x - this.tv.x) * 0.35, this.tv.y + (_v.y - this.tv.y) * 0.35, this.tv.z + (_v.z - this.tv.z) * 0.35);
    }
    this.prevTarget.copy(this.palmW); this.hasPrev = true;
    this.target.set(this.palmW.x, this.palmW.y, this.palmW.z);

    if (!this.visible) { this.visible = true; this.group.visible = true; }

    // Телепорт, только если рука появилась заново или сильно отстала
    if (!this.inWorld || this.body.position.distanceTo(this.target) > 1.2) {
      this.release(false);
      this.body.position.copy(this.target); this.body.velocity.set(0, 0, 0);
      if (!this.inWorld) { world.addBody(this.body); this.inWorld = true; }
    }

    // Коллайдеры пальцев следуют за позой пальцев (смещения относительно ладони)
    COLLIDER_IDX.forEach((idx, i) => this.body.shapeOffsets[i + 1].set(
      this.wj[idx].x - this.palmW.x, this.wj[idx].y - this.palmW.y, this.wj[idx].z - this.palmW.z));
    this.body.updateBoundingRadius(); this.body.aabbNeedsUpdate = true;

    // История скорости физической руки — для броска с передачей импульса
    this.hist.push({ t: now, x: this.body.velocity.x, y: this.body.velocity.y, z: this.body.velocity.z });
    while (this.hist.length && now - this.hist[0].t > 300) this.hist.shift();

    if (this.gesture && !this.held && !this.uiLock) this.tryGrab();   // пока указка на меню — захват отключён
    else if (!this.gesture && this.held) this.release(true, now);
  }

  hide() {
    this.release(false);
    this.visible = false; this.group.visible = false; this.hasPrev = false; this.hasSafe = false; this.hist.length = 0;
    this.ray.visible = this.ring.visible = false;
    if (this.inWorld) { world.removeBody(this.body); this.inWorld = false; }
  }

  /** Захват: ближайший динамический предмет к ладони или кончикам пальцев. */
  tryGrab() {
    const probes = [this.body.position, ...[4, 8, 12, 16, 20].map(i => new CANNON.Vec3(this.wj[i].x, this.wj[i].y, this.wj[i].z))];
    let best = null, bestD = CFG.hand.grabReach;
    for (const o of allObjs) {
      if (!o.dynamic || o.heldBy) continue;
      for (const p of probes) { const d = distToObj(o, p); if (d < bestD) { bestD = d; best = o; } }
    }
    if (!best) return;
    // LockConstraint приваривает предмет к руке (положение + ориентация), но с ограниченной силой:
    // тяжёлое тянет руку вниз и запаздывает, слишком тяжёлое вообще не поднимается.
    this.constraint = new CANNON.LockConstraint(this.body, best.body, { maxForce: CFG.hand.grabMaxForce });
    world.addConstraint(this.constraint);
    this.held = best; best.heldBy = this;
    best.savedMask = best.body.collisionFilterMask;
    best.body.collisionFilterMask = best.savedMask & ~(G_PLAYER | G_HAND);   // удерживаемое не толкает игрока и свою руку
    best.savedDamp = best.body.angularDamping; best.body.angularDamping = Math.max(best.savedDamp, 0.4);
    best.body.wakeUp();
  }

  /** Отпускание. При throwIt предмет получает усреднённую скорость руки (бросок). */
  release(throwIt = false, now = 0) {
    if (!this.held) return;
    world.removeConstraint(this.constraint);
    const o = this.held;
    o.body.collisionFilterMask = o.savedMask ?? MASK_OBJ;
    o.body.angularDamping = o.savedDamp ?? 0.05;
    o.heldBy = null; this.held = null; this.constraint = null;
    if (throwIt) {
      // Берём скорость за окно 40–180 мс до отпускания: раскрытие ладони само тормозит руку
      let n = 0, vx = 0, vy = 0, vz = 0;
      for (const s of this.hist) { const age = now - s.t; if (age >= 40 && age <= 180) { vx += s.x; vy += s.y; vz += s.z; n++; } }
      if (n) {
        _v.set(vx / n, vy / n, vz / n).multiplyScalar(CFG.hand.throwBoost);
        const sp = _v.length(); if (sp > CFG.hand.maxThrow) _v.multiplyScalar(CFG.hand.maxThrow / sp);
        o.body.velocity.set(_v.x, _v.y, _v.z);
      }
    }
  }

  /** После физики: рисуем руку по физическому телу (не проходит сквозь пол, стол и предметы). */
  updateVisual() {
    if (!this.visible) return;
    _v3.set(this.body.position.x, this.body.position.y, this.body.position.z).sub(this.palmW);
    if (_v3.length() > 0.6) _v3.setLength(0.6);
    const p = this.wj.map(w => w.clone().add(_v3));
    for (let i = 0; i < 21; i++) pushOutOfStatics(p[i], JR[i]);     // смещение к физическому телу тоже не пускаем внутрь
    this.tip.copy(p[8]);
    for (let i = 0; i < 21; i++) this.jointMeshes[i].position.copy(p[i]);
    BONES.forEach(([a, b], i) => {
      const m = this.boneMeshes[i]; _v.copy(p[b]).sub(p[a]);
      const len = Math.max(_v.length(), 1e-5);
      m.position.copy(p[a]).addScaledVector(_v, 0.5); m.scale.set(1, len, 1);
      m.quaternion.setFromUnitVectors(Y_AXIS, _v.multiplyScalar(1 / len));
    });
    const arr = this.palmGeo.attributes.position.array;
    [[0, 1, 5], [0, 5, 9], [0, 9, 13], [0, 13, 17]].forEach((t, ti) => t.forEach((idx, vi) => {
      const k = (ti * 3 + vi) * 3; arr[k] = p[idx].x; arr[k + 1] = p[idx].y; arr[k + 2] = p[idx].z; }));
    this.palmGeo.attributes.position.needsUpdate = true; this.palmGeo.computeVertexNormals();

    // Предплечье: от запястья назад вдоль руки, чуть уходит вниз
    // Подушка ладони по базису (вдоль костяшек, нормаль ладони, к пальцам)
    {
      const bx = p[17].clone().sub(p[5]), bw = bx.length(); bx.normalize();
      const bz = p[9].clone().sub(p[0]), bl = bz.length(); bz.normalize();
      const by = new THREE.Vector3().crossVectors(bz, bx).normalize(), bz2 = new THREE.Vector3().crossVectors(bx, by);
      this.blob.quaternion.setFromRotationMatrix(_m.makeBasis(bx, by, bz2));
      this.blob.position.set(0, 0, 0); for (const i of PALM_IDX) this.blob.position.add(p[i]); this.blob.position.multiplyScalar(0.2);
      this.blob.scale.set(bw * 0.5 + 0.014, 0.016, bl * 0.5 + 0.012);
    }
    // Предплечье: дальний конец тоже выталкиваем из препятствий (рука «ложится» на стол)
    const e = p[0].clone().sub(p[9]).normalize();
    const far = p[0].clone().addScaledVector(e, 0.3); pushOutOfStatics(far, 0.045);
    _v.copy(p[0]).sub(far); const fl = Math.max(_v.length(), 1e-4);
    this.forearm.position.copy(far).addScaledVector(_v, 0.5); this.forearm.scale.set(1, fl, 1);
    this.forearm.quaternion.setFromUnitVectors(Y_AXIS, _v.multiplyScalar(1 / fl));

    for (const [m, pre] of this.pairs) { pre.position.copy(m.position); pre.quaternion.copy(m.quaternion); pre.scale.copy(m.scale); }
    const hc = this.held ? 0xd9dde1 : 0xb7bcc1;
    this.mat.color.setHex(hc); this.palm.material.color.setHex(hc); this.forearm.material.color.setHex(hc);       // при захвате руки чуть светлее
  }
}

const _local = new CANNON.Vec3();
function distToObj(o, p) {
  o.body.pointToLocalFrame(p, _local);
  if (o.kind === 'sphere') return _local.length() - o.r;
  return Math.hypot(Math.max(Math.abs(_local.x) - o.half.x, 0), Math.max(Math.abs(_local.y) - o.half.y, 0), Math.max(Math.abs(_local.z) - o.half.z, 0));
}

const handL = new Hand(false), handR = new Hand(true);
const hands = [handL, handR];

/** Пружина-демпфер, тянущая физическую ладонь к реальной (на каждом под-шаге физики). */
world.addEventListener('preStep', () => {
  for (const h of hands) {
    if (!h.inWorld) continue;
    const b = h.body, K = CFG.hand.stiffness, C = 2 * Math.sqrt(K * b.mass);
    _cv.set((h.target.x - b.position.x) * K + (h.tv.x - b.velocity.x) * C,
            (h.target.y - b.position.y) * K + (h.tv.y - b.velocity.y) * C,
            (h.target.z - b.position.z) * K + (h.tv.z - b.velocity.z) * C);
    const len = _cv.length();
    if (len > CFG.hand.maxForce) _cv.scale(CFG.hand.maxForce / len, _cv);
    _cv.y += b.mass * 9.82;                                    // компенсация собственного веса руки
    b.force.vadd(_cv, b.force);
  }
});

/* ---- Синтетическая рука для мыши (если камеры нет) ---- */
function handTemplate(curl, side) {
  const J = Array.from({ length: 21 }, () => new THREE.Vector3());
  const F = [[5, 0.030, 0.095, .045, .026, .022], [9, 0.010, 0.100, .050, .030, .024], [13, -0.010, 0.095, .045, .028, .023], [17, -0.028, 0.085, .036, .020, .020]];
  for (const [i0, fx, y, l1, l2, l3] of F) {
    const a1 = curl * 1.2, a2 = a1 + curl * 1.1, a3 = a2 + curl * 0.7, dir = a => new THREE.Vector3(0, Math.cos(a), -Math.sin(a));
    J[i0].set(-side * fx, y, 0);
    J[i0 + 1].copy(J[i0]).addScaledVector(dir(a1), l1); J[i0 + 2].copy(J[i0 + 1]).addScaledVector(dir(a2), l2); J[i0 + 3].copy(J[i0 + 2]).addScaledVector(dir(a3), l3);
  }
  const d0 = new THREE.Vector3(-side * 0.7, 0.7, 0.1).normalize(), d1 = new THREE.Vector3(side * 0.55, 0.55, -0.6).normalize();
  J[1].set(-side * 0.025, 0.02, 0);
  [0.045, 0.035, 0.03].forEach((L, i) => J[i + 2].copy(J[i + 1]).addScaledVector(d0.clone().lerp(d1, clamp(curl * [0.4, 0.8, 1][i], 0, 1)).normalize(), L));
  return J;
}
const _tilt = new THREE.Euler(-0.6, 0, 0);
function updateMouseHand(dt, now) {
  if (tracking.active) return;
  mouse.curl += ((mouse.down ? 1 : 0) - mouse.curl) * Math.min(1, dt * 12);
  const nx = vrMode ? 0.2 : mouse.nx, ny = vrMode ? -0.25 : mouse.ny;
  const th = Math.tan(rad(camera.fov / 2)), d = mouse.depth;
  const anchor = new THREE.Vector3(nx * th * camera.aspect * d, ny * th * d, -d);
  const tpl = handTemplate(mouse.curl, 1);
  for (let i = 0; i < 21; i++) handR.tgt[i].copy(tpl[i]).applyEuler(_tilt).add(anchor);
  if (!handR.hasJoints) handR.joints.forEach((j, i) => j.copy(handR.tgt[i]));
  handR.hasJoints = true; handR.gesture = mouse.down; handR.setSeen(now); handR.pinch = 0; handR.curl3 = 1;
}

/* ==========================================================================
 * 9. ТРЕКИНГ РУК (MediaPipe) — полностью в фоне
 * ========================================================================== */
const video = $('video');
const tracking = { active: false, hands: null, stream: null, busy: false,
                   facing: isMobile ? 'environment' : 'user', mirror: !isMobile };

async function startTracking() {
  if (tracking.active) return;
  if (!window.Hands) throw new Error('MediaPipe недоступен');
  tracking.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: tracking.facing }, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  video.srcObject = tracking.stream; await video.play();
  const fm = tracking.stream.getVideoTracks()[0].getSettings().facingMode;
  tracking.mirror = fm ? fm === 'user' : !isMobile;           // фронтальная камера зеркальна
  if (!tracking.hands) {
    tracking.hands = new window.Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
    tracking.hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5, selfieMode: false });
    tracking.hands.onResults(onHandResults);
    await tracking.hands.initialize();
  }
  tracking.active = true; trackLoop();
}
async function trackLoop() {
  if (!tracking.active) return;
  if (video.readyState >= 2 && !tracking.busy) {
    tracking.busy = true;
    try { await tracking.hands.send({ image: video }); } catch (e) { console.warn(e); }
    tracking.busy = false;
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(trackLoop); else requestAnimationFrame(trackLoop);
}

function onHandResults(res) {
  const now = performance.now(), dets = res.multiHandLandmarks || [];
  if (!dets.length) return;
  const sgn = tracking.mirror ? -1 : 1, xs = dets.map(l => sgn * (l[0].x - 0.5)), slots = [];
  if (dets.length >= 2) slots.push(...(xs[0] < xs[1] ? [handL, handR] : [handR, handL]));
  else {
    const recent = h => now - h.lastSeen < 600 && h.hasJoints;
    let h;
    if (recent(handL) && !recent(handR)) h = handL;
    else if (recent(handR) && !recent(handL)) h = handR;
    else if (recent(handL) && recent(handR)) h = Math.abs(handL.tgt[0].x - xs[0]) < Math.abs(handR.tgt[0].x - xs[0]) ? handL : handR;
    else h = xs[0] < 0 ? handL : handR;
    slots.push(h);
  }
  dets.slice(0, 2).forEach((lm, i) => applyLandmarks(slots[i], lm, now));
}

/**
 * 21 нормализованная точка → метры в системе головы. Размер ладони (запястье→основание среднего
 * пальца ≈ 9.5 см) даёт расстояние; остальные точки откладываются от запястья в метрах.
 * Фильтр: адаптивный EMA — малое движение (дрожание) сильно сглаживается, быстрое проходит почти без задержки.
 */
function applyLandmarks(hand, lm, now) {
  const W = video.videoWidth || 640, H = video.videoHeight || 480, asp = H / W;
  const sgn = tracking.mirror ? -1 : 1, w = lm[0], m = lm[9];
  const first = !hand.hasJoints || (now - hand.lastSeen) > 600;
  const raw = Math.max(Math.hypot(m.x - w.x, (m.y - w.y) * asp), 0.03);
  hand.size = first ? raw : hand.size + (raw - hand.size) * 0.25;       // сглаживаем оценку глубины
  const HALF = 0.75;
  const depth = clamp(0.095 / (hand.size * 2 * HALF), 0.25, 1.0), mpn = 2 * HALF * depth;
  const ax = sgn * (w.x - 0.5) * mpn, ay = (0.5 - w.y) * asp * mpn;
  for (let i = 0; i < 21; i++) {
    const l = lm[i];
    _v.set(ax + sgn * (l.x - w.x) * mpn, ay - (l.y - w.y) * asp * mpn, -depth - (l.z - w.z) * mpn);
    const a = first ? 1 : clamp(0.18 + hand.tgt[i].distanceTo(_v) * 7, 0.18, 0.9);
    hand.tgt[i].lerp(_v, a);
    if (first) hand.joints[i].copy(hand.tgt[i]);
  }
  hand.hasJoints = true; hand.setSeen(now);
  hand.gesture = detectGrab(hand);
}

/**
 * Жест «кулак/щипок». curl — насколько кончики 4 пальцев приблизились к запястью относительно
 * оснований пальцев (вытянут ≈1.9, кулак ≈1.0); pinch — сближение большого и указательного.
 */
function detectGrab(h) {
  const J = h.tgt, palm = J[0].distanceTo(J[9]) || 1e-3;
  const c = (mcp, tip) => clamp((1.7 - J[tip].distanceTo(J[0]) / Math.max(J[mcp].distanceTo(J[0]), 1e-3)) / 0.7, 0, 1);
  const ci = c(5, 8), cm = c(9, 12), cr = c(13, 16), cp = c(17, 20);
  const curl = (ci + cm + cr + cp) / 4;
  h.curl3 = (cm + cr + cp) / 3;                                     // три «свободных» пальца
  h.pinch = clamp((0.9 - J[4].distanceTo(J[8]) / palm) / 0.6, 0, 1);   // щипок большой+указательный (жест OK)
  const sgrab = Math.max(curl, h.pinch);
  return h.gesture ? sgrab > CFG.hand.grabOff : sgrab > CFG.hand.grabOn;
}

/* ==========================================================================
 * 9b. 3D-МЕНЮ: вход (ENTER / OPTIONS / MODS / INFO) и sandbox-панель создания предметов
 *     Нажатие: ткнуть кончиком указательного пальца в пункт, ИЛИ задержать взгляд ~1 с,
 *     ИЛИ тапнуть по экрану, глядя на пункт; на компьютере — кликнуть мышью.
 * ========================================================================== */
const state = { gazeWalk: true, sixdof: true, mode: 'sandbox' };
const PX = 512, ROW = 0.17, PAD = 0.05;
const ui = { gaze: null, mouse: null };

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/** Иконка в тёмном квадрате с белой рамкой (стиль как на референсе) */
function drawIcon(c, name, x, y, s) {
  c.save(); c.translate(x, y);
  c.fillStyle = '#0a0c0d'; c.strokeStyle = '#fff'; c.lineWidth = s * 0.05;
  rrect(c, 0, 0, s, s, s * 0.14); c.fill(); c.stroke();

/** Панель-меню: плоскость с canvas-текстурой, до 7 строк. Прозрачный фон — только значки и текст. */
class Panel {
  constructor(w) {
    this.w = w; this.h = 7 * ROW + 2 * PAD; this.items = []; this.hover = null; this.dwell = 0; this.sig = ''; this.gazeKey = null;
    this.canvas = document.createElement('canvas');

    this.mesh.renderOrder = 50; this.mesh.visible = false; scene.add(this.mesh);

  }
  setItems(items) { this.items = items; this.sig = ''; }
  place(pos, look) {
    this.mesh.position.copy(pos);

    const it = this.items[Math.floor((this.h / 2 - ly - PAD) / ROW)];

  }
  draw() {
    const c = this.ctx; c.clearRect(0, 0, this.canvas.width, this.canvas.height);
    try { c.letterSpacing = '2px'; } catch {}
    this.items.forEach((it, i) => {
      const y = (PAD + i * ROW) * PX, rh = ROW * PX, s = 0.12 * PX, hot = this.hover === it.id;
      if (hot) { c.fillStyle = 'rgba(255,255,255,0.13)'; rrect(c, 4, y, this.canvas.width - 8, rh - 6, 14); c.fill(); }
      let tx = 0.04 * PX;
      if (it.icon) { drawIcon(c, it.icon, 0.03 * PX, y + (rh - s) / 2 - 3, s); tx = 0.19 * PX; }
      c.fillStyle = it.id === 'noop' ? '#d3dadd' : '#fff';
      c.font = `bold ${it.small ? 30 : 42}px "Trebuchet MS","Segoe UI",system-ui,sans-serif`;
      c.textBaseline = 'middle'; c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 6;
      c.fillText(it.label, tx, y + rh / 2 - 3);
      c.shadowBlur = 0;
      if (hot && this.dwell > 0) { c.fillStyle = '#fff'; c.fillRect(tx, y + rh - 14, (this.canvas.width - tx - 20) * this.dwell, 4); }   // прогресс взгляда

}

const spawned = [], spawnedConstraints = [];
let _wood, _crate;

/**
 * Человек-ragdoll (манекен): 11 твёрдых тел, соединённых суставами —
 * ConeTwistConstraint (шея, талия, плечи, бёдра) и HingeConstraint (локти, колени).
 * Его можно толкать, хватать за любую часть тела, поднимать и бросать.
 */
function spawnPerson(x, z, isBot = false) {
  const shirt = isBot ? 0xb8382e : new THREE.Color().setHSL(Math.random(), 0.5, 0.5).getHex(), pants = isBot ? 0x2b2d31 : 0x2f3640, skin = 0xd9a98a;
  const y0 = 0.03;
  const part = (size, cx, cy, mass, color) => addBox({ size, pos: [x + cx, y0 + cy, z], mass, color, rough: 0.8, group: G_RAG });
  const pelvis = part([0.32, 0.16, 0.18], 0, 0.95, 10, pants);
  const torso = part([0.34, 0.42, 0.2], 0, 1.24, 14, shirt);
  const head = addSphere({ r: 0.12, pos: [x, y0 + 1.62, z], mass: 4, color: skin, rough: 0.7, group: G_RAG, withStripe: false });
  const parts = [pelvis, torso, head], cs = [], V = (a, b, c) => new CANNON.Vec3(a, b, c);
  const cone = (A, B, pa, pb, ax, angle, twist) => cs.push(new CANNON.ConeTwistConstraint(A.body, B.body,
    { pivotA: pa, pivotB: pb, axisA: ax, axisB: ax.clone(), angle, twistAngle: twist, collideConnected: false }));
  const hinge = (A, B, pa, pb) => cs.push(new CANNON.HingeConstraint(A.body, B.body,
    { pivotA: pa, pivotB: pb, axisA: V(1, 0, 0), axisB: V(1, 0, 0), collideConnected: false }));
  cone(pelvis, torso, V(0, 0.08, 0), V(0, -0.21, 0), V(0, 1, 0), 0.35, 0.3);      // талия
  cone(torso, head, V(0, 0.24, 0), V(0, -0.14, 0), V(0, 1, 0), 0.5, 0.5);         // шея
  for (const sd of [-1, 1]) {
    const ua = part([0.09, 0.3, 0.09], sd * 0.235, 1.30, 2.5, shirt);
    const fa = part([0.08, 0.28, 0.08], sd * 0.235, 1.01, 1.5, skin);
    const th = part([0.13, 0.42, 0.13], sd * 0.09, 0.66, 7, pants);
    const sh = part([0.11, 0.42, 0.11], sd * 0.09, 0.24, 4, pants);
    parts.push(ua, fa, th, sh);
    cone(torso, ua, V(sd * 0.215, 0.2, 0), V(-sd * 0.02, 0.14, 0), V(0, -1, 0), 1.3, 0.8);   // плечо
    hinge(ua, fa, V(0, -0.15, 0), V(0, 0.14, 0));                                             // локоть
    cone(pelvis, th, V(sd * 0.09, -0.08, 0), V(0, 0.21, 0), V(0, -1, 0), 0.9, 0.4);          // бедро
    hinge(th, sh, V(0, -0.21, 0), V(0, 0.21, 0));                                             // колено
  }
  for (const c of cs) world.addConstraint(c);
  spawnedConstraints.push(...cs);
  const rec = { parts, pelvis, torso, head, cs, hp: 100, alive: true, flash: 0, deadAt: 0 };
  for (const p of parts) { p.body.linearDamping = 0.1; p.body.angularDamping = 0.5; spawned.push(p); }
  if (isBot) {
    bots.push(rec);
    for (const p of parts) { p.bot = rec; p.isHead = p === head; p.body.addEventListener('collide', e => onBotHit(rec, p, e)); }
  }
  return rec;
}

function clearSpawned() {
  for (const c of spawnedConstraints) world.removeConstraint(c);
  spawnedConstraints.length = 0;
  for (const o of spawned) {
    o.heldBy?.release(false);
    world.removeBody(o.body); scene.remove(o.mesh);
    const i = allObjs.indexOf(o); if (i >= 0) allObjs.splice(i, 1);
  }
  spawned.length = 0;
}

/* ---- Боты: ragdoll-люди с «активной» стойкой, здоровьем и уроном от ударов ---- */
let kills = 0, inGame = false, botsOn = false, spawnT = 1, shootCool = 0;
const bots = [], tracers = [];
const _up = new CANNON.Vec3(), _ax = new CANNON.Vec3(), _wup = new CANNON.Vec3(0, 1, 0);

/** Урон от столкновения: зависит от скорости удара и массы того, чем ударили (кулак, брошенный предмет, бита) */
function onBotHit(rec, part, e) {
  if (!rec.alive) return;
  const ob = e.body;
  if (!(ob.mass > 0) || ob === player || ob.userData?.bot === rec) return;   // статика, игрок и части того же бота не ранят
  const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
  if (v < 1.8) return;
  const m = (ob === handL.body || ob === handR.body) ? 6 : Math.min(ob.mass, 8);
  damageBot(rec, (v - 1.5) * m * (part.isHead ? 2.2 : 1));
}
function damageBot(rec, amount) {
  if (!rec.alive) return;
  rec.hp -= amount; rec.flash = 0.15;
  if (rec.hp <= 0) {
    rec.alive = false; rec.deadAt = performance.now(); kills++;
    for (const p of rec.parts) p.mesh.material.color.lerp(new THREE.Color(0x802020), 0.5);
    refreshConsole();
  }
}
function refreshConsole() { if (consolePanel.mesh.visible && state.mode === 'bots') consolePanel.setItems(itemsBots()); }
function removeBot(rec) {
  for (const c of rec.cs) { world.removeConstraint(c); const i = spawnedConstraints.indexOf(c); if (i >= 0) spawnedConstraints.splice(i, 1); }
  for (const p of rec.parts) {
    p.heldBy?.release(false);
    world.removeBody(p.body); scene.remove(p.mesh);
    for (const arr of [allObjs, spawned]) { const i = arr.indexOf(p); if (i >= 0) arr.splice(i, 1); }
  }
  const k = bots.indexOf(rec); if (k >= 0) bots.splice(k, 1);
}
function spawnBotRandom() {
  for (let tries = 0; tries < 8; tries++) {
    const a = Math.random() * 6.283, r = 6 + Math.random() * 3;
    const x = clamp(player.position.x + Math.cos(a) * r, -mapBounds.x + 1, mapBounds.x - 1);
    const z = clamp(player.position.z + Math.sin(a) * r, mapBounds.z0 + 1, mapBounds.z1 - 1);
    if (Math.hypot(x - player.position.x, z - player.position.z) > 3.5) { spawnPerson(x, z, true); return; }
  }
}
/** Управление живыми ботами на каждом под-шаге физики: идут к игроку, держат стойку, получают «парение» */
world.addEventListener('preStep', () => {
  if (!botsOn) return;
  for (const b of bots) {
    if (!b.alive) continue;
    const pp = b.pelvis.body.position;
    let dx = player.position.x - pp.x, dz = player.position.z - pp.z; const dist = Math.hypot(dx, dz) || 1;
    dx /= dist; dz /= dist;
    const speed = dist > 1.0 ? 1.1 : 0;
    for (const part of b.parts) {
      const bd = part.body;
      bd.force.x += (dx * speed - bd.velocity.x) * bd.mass * 6;
      bd.force.z += (dz * speed - bd.velocity.z) * bd.mass * 6;
      bd.force.y += bd.mass * 9.82 * 0.92;                       // почти невесомые — «стоят» на ногах
      if (part !== b.head) {                                      // PD-регулятор: держим конечности и корпус вертикально
        bd.quaternion.vmult(_up.set(0, 1, 0), _up); _up.cross(_wup, _ax);
        const I = Math.max(bd.inertia.x, bd.inertia.y, bd.inertia.z);
        bd.torque.x += _ax.x * I * 60 - bd.angularVelocity.x * I * 12;
        bd.torque.y += _ax.y * I * 60 - bd.angularVelocity.y * I * 12;
        bd.torque.z += _ax.z * I * 60 - bd.angularVelocity.z * I * 12;
      }
    }
  }
});
function updateBots(dt, now) {
  shootCool -= dt;
  for (let i = tracers.length - 1; i >= 0; i--) { const t = tracers[i]; t.life -= dt; if (t.life <= 0) { scene.remove(t.mesh); tracers.splice(i, 1); } }
  botsOn = inGame && state.mode === 'bots' && !menu.mesh.visible;
  for (const b of [...bots]) {
    if (b.flash > 0) b.flash -= dt;
    for (const p of b.parts) p.mesh.material.emissive.setHex(b.flash > 0 ? 0x661111 : 0x000000);
    if (!b.alive && now - b.deadAt > 5000) removeBot(b);
  }
  if (!botsOn) return;
  spawnT -= dt;
  if (spawnT <= 0 && bots.filter(b => b.alive).length < 4) { spawnBotRandom(); spawnT = 3; }
}

/** Выстрел из удерживаемого пистолета: прицел — по взгляду, hitscan-луч по ботам и миру */
const _rr = new CANNON.RaycastResult();
function shoot() {
  if (shootCool > 0) return false;
  const h = hands.find(x => x.held && x.held.isGun);
  if (!h) return false;
  const gun = h.held; shootCool = 0.2;
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const from = new CANNON.Vec3(gun.body.position.x + dir.x * 0.15, gun.body.position.y + 0.04, gun.body.position.z + dir.z * 0.15);
  const to = new CANNON.Vec3(from.x + dir.x * 40, from.y + dir.y * 40, from.z + dir.z * 40);
  _rr.reset();
  world.raycastClosest(from, to, { collisionFilterMask: G_RAG | G_WORLD, skipBackfaces: true }, _rr);
  let end = to;
  if (_rr.hasHit) {
    const hp = _rr.hitPointWorld; end = new CANNON.Vec3(hp.x, hp.y, hp.z);
    const o = _rr.body.userData;
    if (o && o.bot) {
      damageBot(o.bot, o.isHead ? 150 : 55);
      _rr.body.applyImpulse(new CANNON.Vec3(dir.x * 10, dir.y * 10, dir.z * 10), new CANNON.Vec3(hp.x - _rr.body.position.x, hp.y - _rr.body.position.y, hp.z - _rr.body.position.z));
    }
  }
  const a = new THREE.Vector3(from.x, from.y, from.z), b = new THREE.Vector3(end.x, end.y, end.z), v = b.clone().sub(a), len = v.length();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 1, 5), new THREE.MeshBasicMaterial({ color: 0xffe08a, fog: false }));
  tr.position.copy(a).addScaledVector(v, 0.5); tr.scale.y = len; tr.quaternion.setFromUnitVectors(Y_AXIS, v.multiplyScalar(1 / len));
  scene.add(tr); tracers.push({ mesh: tr, life: 0.07 });
  gun.body.applyImpulse(new CANNON.Vec3(0, 0.5, 0.4), new CANNON.Vec3(0, 0, 0));      // небольшая отдача
  return true;
}

function activate(id, p) {
  if (id.startsWith('spawn:')) return spawnItem(id.slice(6), p);
  if (id.startsWith('map:')) { loadMap(id.slice(4)); kills = 0; menu.setItems(itemsMaps()); return; }
  switch (id) {
    case 'enter':
      menu.mesh.visible = false; inGame = true; kills = 0; spawnT = 1;
      consolePanel.setItems(state.mode === 'bots' ? itemsBots() : itemsSpawn(false)); consolePanel.place(CONSOLE_POS, START_EYE);
      if (state.mode === 'bots') spawnItem('gun', consolePanel);
      break;
    case 'maps': menu.setItems(itemsMaps()); break;
    case 'mode': state.mode = state.mode === 'bots' ? 'sandbox' : 'bots'; menu.setItems(itemsMain()); break;
    case 'options': menu.setItems(itemsOptions()); break;
    case 'mods': menu.setItems(itemsSpawn(true)); break;
    case 'info': menu.setItems(itemsInfo()); break;
    case 'back': menu.setItems(itemsMain()); break;
    case 'lens': lensCorrection = !lensCorrection; menu.setItems(itemsOptions()); break;
    case 'gaze': state.gazeWalk = !state.gazeWalk; menu.setItems(itemsOptions()); break;
    case 'sixdof': state.sixdof = !state.sixdof; menu.setItems(itemsOptions()); break;
    case 'center': recenter(); break;
    case 'menu': inGame = false; consolePanel.mesh.visible = false; menu.setItems(itemsMain()); placeInFront(menu); break;
    case 'clear': clearSpawned(); bots.length = 0; kills = 0; refreshConsole(); break;
  }
}

const _o = new THREE.Vector3(), _d = new THREE.Vector3(), _inv = new THREE.Matrix4();
/** Каждый кадр: тычок пальцем, взгляд с таймером, наведение мыши → подсветка и активация пунктов */
function updateUI(dt) {
  ui.gaze = null;
  const gazeOn = vrMode && head.hasGyro;
  for (const h of hands) {            // фронт щипка (жест OK) — один клик за щипок
    const on = h.visible && h.pinch > 0.65;
    h.edge = on && !h.pinchOn; h.pinchOn = on; h.rayShown = false; h.uiLock = false; h.edgeUsed = false;
  }
  for (const p of [menu, consolePanel]) {
    if (!p.mesh.visible) { p.hover = null; continue; }
    p.mesh.updateMatrixWorld(true);

    // 1) тычок кончиком указательного пальца: зашёл в плоскость панели спереди → нажатие
    let hover = null;
    hands.forEach((h, i) => {
      if (!h.visible) { p.armed[i] = true; return; }
      _v.copy(h.tip); p.mesh.worldToLocal(_v);
      const inside = Math.abs(_v.x) < p.w / 2 && Math.abs(_v.y) < p.h / 2;
      if (!inside || _v.z > 0.09) { p.armed[i] = true; return; }
      if (_v.z < -0.08) return;
      const it = p.hit(_v.x, _v.y);
      if (it) { hover = it.id; if (p.armed[i] && _v.z < 0.03) { p.armed[i] = false; activate(it.id, p); } }
    });

    // 1b) указка: луч от ладони вдоль руки; щипок (жест OK) по пункту = клик; пока луч на меню, захват отключён
    hands.forEach(h => {
      if (!h.visible || h.rayShown) return;
      _inv.copy(p.mesh.matrixWorld).invert();
      const lo = h.wj[9].clone().applyMatrix4(_inv), ld = h.wj[9].clone().sub(h.wj[0]).normalize().transformDirection(_inv);
      if (ld.z >= -0.05 || lo.z <= 0) return;
      const t = -lo.z / ld.z; if (t <= 0 || t > 5) return;
      const hx = lo.x + ld.x * t, hy = lo.y + ld.y * t;
      if (Math.abs(hx) > p.w / 2 + 0.1 || Math.abs(hy) > p.h / 2 + 0.1) return;
      const hit = new THREE.Vector3(hx, hy, 0.004).applyMatrix4(p.mesh.matrixWorld);
      _v.copy(hit).sub(h.wj[9]); const len = Math.max(_v.length(), 1e-4);
      h.ray.position.copy(h.wj[9]).addScaledVector(_v, 0.5); h.ray.scale.y = len; h.ray.quaternion.setFromUnitVectors(Y_AXIS, _v.multiplyScalar(1 / len));
      h.ring.position.copy(hit); h.ring.quaternion.copy(p.mesh.quaternion);
      h.ray.visible = h.ring.visible = true; h.rayShown = true; h.uiLock = true;
      const it = p.hit(hx, hy);
      if (it) { hover = hover ?? it.id; if (h.edge) { h.edgeUsed = true; activate(it.id, p); } }
    });

    // 2) мышь (на компьютере)
    if (!hover && ui.mouse && ui.mouse.p === p && ui.mouse.item) hover = ui.mouse.item.id;

    // 3) взгляд: луч из центра экрана, активация после ~1.1 с (Cardboard без контроллеров)
    let gazeId = null;
    if (!hover && gazeOn) {
      _inv.copy(p.mesh.matrixWorld).invert();
      _o.copy(camera.position).applyMatrix4(_inv);
      _d.set(0, 0, -1).applyQuaternion(camera.quaternion).transformDirection(_inv);
      if (_d.z < -1e-3) {
        const t = -_o.z / _d.z;
        if (t > 0 && t < 5) { const gy = _o.y + _d.y * t, it = Math.abs(gy) < p.h / 2 ? p.hit(_o.x + _d.x * t, gy) : null; if (it) gazeId = it.id; }
      }
    }
    if (gazeId) {
      hover = gazeId; ui.gaze = { p, id: gazeId };
      if (p.gazeKey !== gazeId) { p.gazeKey = gazeId; p.dwell = 0; }
      p.dwell += dt / 1.1;
      if (p.dwell >= 1) { p.dwell = 0; p.gazeKey = null; activate(gazeId, p); }
    } else { p.gazeKey = null; p.dwell = 0; }

    p.hover = hover;
    const sig = hover + ':' + Math.round(p.dwell * 20) + ':' + p.items.map(i => i.label).join('|');
    if (sig !== p.sig) { p.sig = sig; p.draw(); }
  }
  for (const h of hands) if (!h.rayShown) h.ray.visible = h.ring.visible = false;
  // Щипок свободной рукой, пока другая держит пистолет = выстрел
  hands.forEach((h, i) => { if (h.edge && !h.edgeUsed && hands[1 - i].held && hands[1 - i].held.isGun) shoot(); });
}

const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2();
function mousePick(e) {
  _ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1));
  _ray.setFromCamera(_ndc, camera);
  for (const p of [menu, consolePanel]) {
    if (!p.mesh.visible) continue;
    const hit = _ray.intersectObject(p.mesh)[0];
    if (hit) { const l = p.mesh.worldToLocal(hit.point.clone()); return { p, item: p.hit(l.x, l.y) }; }
  }
  return null;
}

/* ==========================================================================
 * 10. ДВИЖЕНИЕ ИГРОКА
 * ========================================================================== */
const _f = new THREE.Vector3(), _r = new THREE.Vector3();
function updatePlayer(dt) {
  _f.set(0, 0, -1).applyQuaternion(camera.quaternion);
  const pitch = Math.asin(clamp(_f.y, -1, 1));
  _f.y = 0; if (_f.lengthSq() < 1e-4) _f.set(0, 0, -1); _f.normalize();
  _r.crossVectors(_f, Y_AXIS);
  let mz = 0, mx = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) mz++;
  if (keys.has('KeyS') || keys.has('ArrowDown')) mz--;
  if (keys.has('KeyD')) mx++; if (keys.has('KeyA')) mx--;
  if (state.gazeWalk && head.hasGyro && pitch < CFG.gazeWalkPitch) mz++;           // взгляд вниз = идти
  if (state.sixdof && motion.stepT > 0) mz++;                                       // шаги на месте = идти
  motion.stepT = Math.max(0, motion.stepT - dt);
  if (keys.has('KeyQ') || keys.has('ArrowLeft')) head.yawManual += dt * 1.6;
  if (keys.has('KeyE') || keys.has('ArrowRight')) head.yawManual -= dt * 1.6;
  const len = Math.hypot(mx, mz) || 1, k = Math.min(1, dt * (onGround ? 12 : 3));
  player.velocity.x += ((_f.x * mz + _r.x * mx) / len * CFG.walkSpeed - player.velocity.x) * k;
  player.velocity.z += ((_f.z * mz + _r.z * mx) / len * CFG.walkSpeed - player.velocity.z) * k;
  if (player.position.y < -5) { player.position.set(0, 0.5, 1.5); player.velocity.set(0, 0, 0); }
  updateHeadPos(dt);
  camera.position.set(player.position.x, player.position.y + CFG.eyeHeight, player.position.z).add(motion.p);
  if (camera.position.y < 0.3) camera.position.y = 0.3;
}

/* ==========================================================================
 * 11. ГЛАВНЫЙ ЦИКЛ
 * ========================================================================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 1 / 240, 0.05); last = now;
  updateHead(); updatePlayer(dt);
  camera.updateMatrixWorld(true);
  sky.position.copy(camera.position);
  updateMouseHand(dt, now);
  for (const h of hands) h.update(dt, now);
  world.step(1 / 60, dt, 3);
  for (const o of allObjs) if (o.dynamic) { o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion); }
  for (const h of hands) h.updateVisual();
  updateUI(dt);
  updateBots(dt, now);
  render();
}

/* ==========================================================================
 * 12. ЕДИНСТВЕННАЯ КНОПКА: ВХОД / ВЫХОД ИЗ VR
 * ========================================================================== */
let fsEntered = false;
function setVR(on) {
  vrMode = on; document.body.classList.toggle('vr', on);
  head.needCenter = true;
}
async function enterVR() {
  // iOS 13+: разрешения на гироскоп и акселерометр нужно запрашивать сразу в обработчике клика
  const perms = [];
  for (const API of [window.DeviceOrientationEvent, window.DeviceMotionEvent])
    try { if (API && API.requestPermission) perms.push(API.requestPermission()); } catch {}
  // Полноэкранный режим и альбомная ориентация (на iPhone Safari их нет — просто пропускаем)
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); fsEntered = true; } catch {}
  try { await screen.orientation.lock('landscape'); } catch {}
  navigator.wakeLock?.request('screen').catch(() => {});
  setVR(true);
  await Promise.allSettled(perms);
  // Камера и трекинг рук — скрыто, в фоне
  try { await startTracking(); } catch (e) { console.warn('Трекинг рук недоступен:', e); }
}
function exitVR() { setVR(false); if (fsEntered && document.fullscreenElement) document.exitFullscreen().catch(() => {}); fsEntered = false; }
$('vr').addEventListener('click', () => (vrMode ? exitVR() : enterVR()));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && vrMode && fsEntered) { fsEntered = false; setVR(false); } });

/* ==========================================================================
 * 13. ЗАПУСК
 * ========================================================================== */
loadMap('grid');
// PWA: регистрируем service worker (только по HTTPS или на localhost) — устанавливается на экран «Домой», работает офлайн
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)));
resize();
requestAnimationFrame(frame);
window.__sandbox = { world, scene, camera, hands, player, tracking, allObjs, menu, consolePanel, activate, pushOutOfStatics, state, bots, loadMap, damageBot, shoot };   // отладка из консоли
</script>
</body>
